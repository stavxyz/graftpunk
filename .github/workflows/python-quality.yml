name: Python Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filter-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python_changed: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for accurate path filtering on push events
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - '.github/workflows/python-quality.yml'
              - 'pyproject.toml'
              - 'uv.lock'

  quality:
    needs: filter-paths
    if: needs.filter-paths.outputs.python_changed == 'true'
    name: Code Quality - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uvx ruff check .

      - name: Format check with ruff
        run: uvx ruff format --check .

      - name: Type check with ty
        # TODO: Re-enable blocking mode once ty reaches 1.0 or nodriver ships
        # proper type stubs. Current false positives are from nodriver's
        # auto-generated CDP types that ty cannot resolve statically.
        run: uvx ty check src/ || echo "::warning::ty found type errors (non-blocking while ty is pre-1.0)"

      - name: Security scan
        run: |
          # Security scanning strategy:
          # - pip-audit: BLOCKING - fails CI on known vulnerabilities (critical for supply chain security)
          # - safety: NON-BLOCKING - provides additional vulnerability database check (may have false positives)
          # - bandit: NON-BLOCKING - static analysis for code issues (requires triage for false positives)
          echo "=== pip-audit: checking for known vulnerabilities ==="
          # Ignore PYSEC-2023-242 (httpie vulnerability) - latest version still affected, no fix available
          uvx pip-audit --skip-editable --ignore-vuln PYSEC-2023-242
          echo "=== safety: checking against safety database ==="
          uvx safety check --full-report || echo "::warning::safety found issues"
          echo "=== bandit: static security analysis ==="
          uvx bandit -r src/ -ll || echo "::warning::bandit found issues (non-blocking)"

      - name: Run tests with pytest
        run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  typer-compat:
    # uv.lock pins one typer; consumers resolve others. The vendored-Click
    # break (see docs/rfcs/2026-07-19-typer-native-plugin-commands.md) shipped
    # because CI only ever exercised the locked generation. This matrix runs
    # the plugin-CLI suite on the oldest supported typer and the latest.
    needs: filter-paths
    if: needs.filter-paths.outputs.python_changed == 'true'
    name: Plugin CLI on typer ${{ matrix.typer-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        typer-version: ["==0.21.*", ">=0.26"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Force typer ${{ matrix.typer-version }}
        run: |
          uv pip install "typer${{ matrix.typer-version }}"
          uv run --no-sync python -c "import typer; print('typer', typer.__version__)"

      - name: Run plugin CLI tests
        run: uv run --no-sync pytest tests/unit/test_plugin_commands.py tests/unit/test_command_factory.py tests/unit/test_plugin_runtime.py tests/unit/test_cli_no_external_click.py -v

  # The lean-install contract: `pip install graftpunk` (NO extras) must stay
  # importable, keep a working CLI, and still load a cached session browser-free.
  # Every other job runs `uv sync --all-extras`, so nothing there can catch a
  # browser dependency creeping back into the base install or onto the CLI's
  # eager import path — which is exactly how a release once shipped a `gp` that
  # tracebacked on every invocation. This job installs the built wheel into a
  # clean venv with no extras and exercises the contract for real.
  lean-install:
    needs: filter-paths
    if: needs.filter-paths.outputs.python_changed == 'true'
    name: Lean install (no browser extra)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel with NO extras into a clean venv
        run: |
          uv venv --python 3.13 .lean
          uv pip install --python .lean/bin/python dist/*.whl

      - name: Assert the browser stack is absent
        run: |
          .lean/bin/python - <<'PY'
          import importlib.util
          absent = ["selenium", "requestium", "nodriver", "webdriver_manager",
                    "undetected_chromedriver", "selenium_stealth", "httpie"]
          present = [m for m in absent if importlib.util.find_spec(m) is not None]
          assert not present, f"browser deps leaked into the base install: {present}"
          print("browser stack absent:", ", ".join(absent))
          PY

      - name: Import graftpunk without pulling the browser stack
        run: |
          .lean/bin/python - <<'PY'
          import sys
          import graftpunk
          for mod in ("graftpunk.session", "graftpunk.stealth", "selenium"):
              assert mod not in sys.modules, f"{mod} eagerly imported by `import graftpunk`"
          print("import graftpunk OK")
          PY

      - name: "CLI must start (regression: gp was broken on base installs)"
        run: |
          .lean/bin/gp --help > /dev/null
          .lean/bin/gp version > /dev/null
          .lean/bin/python - <<'PY'
          import subprocess, sys
          # The CLI import itself must not drag in the browser stack.
          code = ("import graftpunk.cli.main, sys; "
                  "assert 'graftpunk.session' not in sys.modules; "
                  "assert 'httpie' not in sys.modules; print('cli import OK')")
          out = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          assert out.returncode == 0, out.stderr
          print(out.stdout.strip())
          PY

      - name: Browser-free session load must work (A4 fixture round-trip)
        run: |
          .lean/bin/python - <<'PY'
          import pathlib
          from graftpunk import load_session_for_api_from_bytes
          fix = pathlib.Path("tests/fixtures")
          enc = (fix / "browserfree_session.enc").read_bytes()
          key = (fix / "browserfree_session.key").read_bytes().strip()
          api = load_session_for_api_from_bytes(enc, key=key)
          cookies = {c.name: c.value for c in api.cookies}
          assert cookies.get("User") == "dummyuser", cookies
          assert cookies.get("Password") == "dummypass", cookies
          assert "Mozilla/5.0 (dummy)" in api.headers["User-Agent"]
          print("browser-free session load OK:", sorted(cookies))
          PY

      - name: Missing-browser errors must name the extra
        run: |
          .lean/bin/python - <<'PY'
          import graftpunk
          try:
              getattr(graftpunk, "BrowserSession")
          except ImportError as exc:
              assert "graftpunk[browser]" in str(exc), exc
              print("actionable error OK")
          else:
              raise AssertionError("expected ImportError without the [browser] extra")
          PY
