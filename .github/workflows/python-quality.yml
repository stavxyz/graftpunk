name: Python Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filter-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python_changed: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for accurate path filtering on push events
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
              - 'typings/**'
              - '.github/workflows/python-quality.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'skills/**'
              - '.claude-plugin/**'
              - 'docs/PLUGIN_DEVELOPMENT.md'
              - 'scripts/**'
              - 'CONTRIBUTING.md'

  quality:
    needs: filter-paths
    if: needs.filter-paths.outputs.python_changed == 'true'
    name: Code Quality - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uvx ruff check .

      - name: Format check with ruff
        run: uvx ruff format --check .

      - name: Type check with ty
        # Blocking, and pinned: ty is pre-1.0 and its diagnostics move between
        # releases. Bump the pin here, in the justfile and in CONTRIBUTING.md together.
        run: uvx ty@0.0.75 check src/

      - name: Security scan
        run: |
          # Security scanning strategy:
          # - pip-audit: BLOCKING - fails CI on known vulnerabilities (critical for supply chain security)
          # - safety: NON-BLOCKING - provides additional vulnerability database check (may have false positives)
          # - bandit: NON-BLOCKING - static analysis for code issues (requires triage for false positives)
          echo "=== pip-audit: checking for known vulnerabilities ==="
          # Ignore PYSEC-2023-242 (httpie vulnerability) - latest version still affected, no fix available
          uvx pip-audit --skip-editable --ignore-vuln PYSEC-2023-242
          echo "=== safety: checking against safety database ==="
          uvx safety check --full-report || echo "::warning::safety found issues"
          echo "=== bandit: static security analysis ==="
          uvx bandit -r src/ -ll || echo "::warning::bandit found issues (non-blocking)"

      - name: Run tests with pytest
        run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  typer-compat:
    # uv.lock pins one typer; consumers resolve others. The vendored-Click
    # break (see docs/rfcs/2026-07-19-typer-native-plugin-commands.md) shipped
    # because CI only ever exercised the locked generation. This matrix runs
    # the whole suite on the oldest supported typer and the latest: test
    # helpers that walk the typer-built CLI broke on the vendored Click too
    # (#249), and a plugin-CLI subset could not see them.
    needs: filter-paths
    if: needs.filter-paths.outputs.python_changed == 'true'
    name: Tests on typer ${{ matrix.typer-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        typer-version: ["==0.21.*", ">=0.26"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Force typer ${{ matrix.typer-version }}
        run: |
          uv pip install "typer${{ matrix.typer-version }}"
          uv run --no-sync python -c "import typer; print('typer', typer.__version__)"

      - name: Run the test suite
        run: uv run --no-sync pytest tests/ -q -n auto

  # The lite-install contract: graftpunk-lite (no extras) must stay importable,
  # keep a working CLI, and still load a cached session browser-free, which is
  # what lets it resolve under Pyodide and Cloudflare Workers (#121). Every other
  # job runs `uv sync --all-extras`, so nothing there can catch a browser
  # dependency creeping into lite's base install or onto the CLI's eager import
  # path; that is how a release once shipped a `gp` that tracebacked on every
  # invocation. This job builds both distributions, installs each wheel into its
  # own clean venv, and checks lite lacks the browser stack and graftpunk has it.
  lite-install:
    needs: filter-paths
    if: needs.filter-paths.outputs.python_changed == 'true'
    name: Lite install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build graftpunk and graftpunk-lite
        run: |
          uv build --out-dir dist/full
          uv run --no-project --with packaging python scripts/build_lite.py --out-dir dist/lite
          ls dist/full dist/lite

      - name: Install each wheel into its own clean venv and check the lite contract
        # The release build runs the same script before it publishes.
        run: scripts/smoke_install.sh dist/lite/graftpunk_lite-*.whl dist/full/graftpunk-*.whl
