[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graftpunk"
version = "1.36.1"
description = "Authenticated browser sessions, captured once and replayed over plain HTTP: stealth login, encrypted at rest, pluggable storage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "stavxyz", email = "stavxyz@users.noreply.github.com" }
]
keywords = ["browser", "session", "automation", "api", "scraping", "selenium", "requests", "har", "cdp", "nodriver", "csrf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# This is the full install: the base dependencies plus the browser-automation
# stack (requestium through httpie below), which live login and stealth driving
# need. The browser-free set (everything above that block) is pure-Python or
# ships WASM wheels; the graftpunk-lite distribution, built from this file by
# scripts/build_lite.py, installs only that set so it resolves under Pyodide and
# Cloudflare Workers (#121). [tool.graftpunk.lite] browser-only names the
# packages lite moves into its own [browser] extra.
dependencies = [
    "requests>=2.28.0",
    "idna>=3.0",
    "cryptography>=42.0.0",
    "dill>=0.3.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.21",
    "rich>=13.0.0",
    "structlog>=23.0.0",
    "python-slugify>=8.0.0",
    "pyotp>=2.9.0",
    "pyyaml>=6.0",
    "brotli>=1.1.0",
    "xlsxwriter>=3.0.0",
    "fpdf2>=2.8.0",
    "packaging>=23.0",
    "requestium>=0.2.5",
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
    "undetected-chromedriver>=3.5.0",
    "selenium-stealth>=1.0.6",
    # nodriver before 0.50.6 ships cdp/network.py with a byte that is not UTF-8,
    # which Python 3.14 refuses to compile.
    "nodriver>=0.48; python_version < '3.14'",
    "nodriver>=0.50.6; python_version >= '3.14'",
    "httpie>=3.0.0",
]

[project.optional-dependencies]
# Empty on graftpunk, whose base dependencies already include the browser stack.
# Kept so requirements written as graftpunk[browser]>=X (generated plugins,
# existing consumers) still resolve. On graftpunk-lite this extra holds the
# browser stack.
browser = []
supabase = [
    "supabase>=2.10.0",
]
s3 = [
    "boto3>=1.34.0",
]
jmespath = [
    "jmespath>=1.0.0",
]
nodriver = [
    # Kept for backwards compatibility: an alias for [browser] (the browser
    # stack on graftpunk-lite, nothing extra on graftpunk).
    "graftpunk[browser]",
]
dev = [
    # The test suite drives real browser code paths, so a dev install needs the
    # browser stack. graftpunk[browser] adds nothing on graftpunk; it is kept so
    # graftpunk-lite's dev extra (rewritten to graftpunk-lite[browser]) pulls it.
    "graftpunk[browser]",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "openpyxl>=3.1.0",
    # The login selector tests run each selector against the recorded HTML.
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
]
all = [
    "graftpunk[browser,supabase,s3,jmespath,nodriver,dev]",
]

[project.scripts]
graftpunk = "graftpunk.cli.main:app"
gp = "graftpunk.cli.main:app"

[project.entry-points."graftpunk.storage"]
local = "graftpunk.storage.local:LocalSessionStorage"

[project.entry-points."graftpunk.keepalive_handlers"]
# Site-specific handlers register themselves via entry points

[project.entry-points."graftpunk.plugins"]
# Site plugins (authentication and CLI commands) register themselves via entry points

[project.entry-points."graftpunk.formatters"]
# Custom output formatters register themselves via entry points

[project.urls]
Homepage = "https://github.com/stavxyz/graftpunk"
Repository = "https://github.com/stavxyz/graftpunk"
Documentation = "https://github.com/stavxyz/graftpunk#readme"
Changelog = "https://github.com/stavxyz/graftpunk/blob/main/CHANGELOG.md"
Issues = "https://github.com/stavxyz/graftpunk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/graftpunk"]

# The sdist is an allowlist: the package plus the files PyPI renders (hatchling
# also adds the root .gitignore it used). Tests, docs, RFCs, examples, CI config
# and scratch directories live in the repository and must not ship — they have
# carried private example data before.
[tool.hatch.build.targets.sdist]
only-include = ["src/graftpunk", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# graftpunk-lite is built from this file by scripts/build_lite.py: same version,
# package, scripts and entry points, with every base dependency named here moved
# into its [browser] extra. tests/unit/test_build_lite.py checks each name
# matches a requirement in [project] dependencies.
[tool.graftpunk.lite]
browser-only = [
    "requestium",
    "selenium",
    "webdriver-manager",
    "undetected-chromedriver",
    "selenium-stealth",
    "nodriver",
    "httpie",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff >= 0.16 formats fenced Python in Markdown. Specs and plans under
# docs/superpowers quote code fragments on purpose; README and other docs
# stay covered so a broken snippet cannot ship.
extend-exclude = ["docs/superpowers/**/*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
# A type: ignore that suppresses nothing is a stale claim about the code; fail on it.
unused-type-ignore-comment = "error"

[tool.ty.environment]
python-version = "3.11"
# typings/ holds a partial stub for nodriver.cdp.network (unreadable upstream file);
# see the .pyi docstring. Not shipped: the wheel and sdist are explicit allowlists.
extra-paths = ["typings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers", "--tb=short", "-n", "auto"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/graftpunk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    # The test suite exercises the browser layer (session.py, stealth.py,
    # backends/*), which the project's base dependencies already install.
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.0.0",
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
]
